<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; manifest-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1F3A5F">
  <meta name="description" content="Robotic DIEP Selection Calculator: a research and educational tool that walks through patient selection for robotic-assisted DIEP flap harvest using preoperative CT angiography. Runs entirely in the browser; nothing is stored or sent.">
  <title>Robotic DIEP Selection Calculator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231F3A5F'/%3E%3Cpath d='M20 27V16.5c0-3.4-2.2-6-5.6-7' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Cpath d='M20 19.5c2.3-1.2 4-3.3 4.6-6' fill='none' stroke='%239CC3F0' stroke-width='2.2' stroke-linecap='round'/%3E%3Ccircle cx='12.6' cy='8.8' r='2.8' fill='%23fff'/%3E%3Ccircle cx='24.8' cy='11.4' r='2.1' fill='%239CC3F0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <header class="site-header">
    <div class="wrap header-bar">
      <div class="brand">
        <picture>
          <source srcset="assets/img/brand/mayo-clinic-logo-white.svg" media="(prefers-color-scheme: dark)">
          <img class="brand-logo" src="assets/img/brand/mayo-clinic-logo.svg" alt="Mayo Clinic" width="59" height="64">
        </picture>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-word" id="brand-word" aria-hidden="true">RoBoDIEP</span>
          <h1 class="brand-title" id="brand-title">Robotic DIEP Selection Calculator</h1>
        </span>
      </div>
      <span class="version-pill" id="version-pill"></span>
    </div>
    <nav class="wrap tabs" aria-label="Sections">
      <div class="tablist" role="tablist" id="tablist"></div>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <div class="band">
      <div class="wrap band-inner">
        <p class="band-title" id="band-title"></p>
        <div class="disclaimer" id="disclaimer" role="note" aria-label="Disclaimer"></div>
      </div>
    </div>
    <div class="wrap">
      <noscript>
        <p class="noscript">This calculator needs JavaScript. All calculations run in your browser; nothing is stored or sent.</p>
      </noscript>
    </div>
    <section class="tabpanel" id="panel-calculator" role="tabpanel" aria-labelledby="tab-calculator"></section>
    <section class="tabpanel" id="panel-measure" role="tabpanel" aria-labelledby="tab-measure" hidden></section>
    <section class="tabpanel" id="panel-evidence" role="tabpanel" aria-labelledby="tab-evidence" hidden></section>
    <section class="tabpanel" id="panel-about" role="tabpanel" aria-labelledby="tab-about" hidden></section>
  </main>

  <footer class="site-footer" id="footer"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="sr-only" id="live" aria-live="polite" aria-atomic="true"></div>

  <dialog class="dialog" id="dialog" aria-labelledby="dialog-title" aria-describedby="dialog-body">
    <h2 class="dialog-title" id="dialog-title"></h2>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-secondary" id="dialog-cancel">Cancel</button>
      <button type="button" class="btn btn-primary" id="dialog-confirm">Confirm</button>
    </div>
  </dialog>

  <div class="print-root" id="print-root"></div>

  <script src="assets/js/framework.js"></script>
  <script src="assets/js/logic.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
